name: Build FlexLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Native integration tests
        run: npm test
      - name: Validate native runtime
        run: npm run check:native
      - name: Build desktop
        run: npm run desktop:build
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          & "release/win-unpacked/FlexLab.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = "release/FlexLab Setup $version.exe"
          $portable = "release/FlexLab $version.exe"
          gh release create $tag "$installer#Windows Installer (x64)" "$portable#Windows Portable (x64)" --target "${{ github.sha }}" --title "FlexLab $version" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: FlexLab-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
